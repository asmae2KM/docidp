[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docidp"
version = "2.0.0"
description = "Schema-constrained document extraction (PDF/images -> Excel/JSON) with routing, validation and self-repair."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.7,<3",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "pillow>=10.3",
  "pypdf>=4.2",
  "python-dotenv>=1.0",
  "langchain-core>=0.3",
  "langchain-groq>=0.2",
  "langchain-openai>=0.2",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40"]
marker = ["marker-pdf>=1.0"]          # heavy (PyTorch): layout-aware parsing + OCR for scanned PDFs
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "reportlab>=4", "streamlit>=1.40"]

[project.scripts]
docidp = "docidp.cli:main"

[tool.setuptools.packages.find]
include = ["docidp*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
